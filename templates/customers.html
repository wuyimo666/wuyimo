<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户管理</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="header">
        <h1>客户管理</h1>
        <a href="/" class="back">返回</a>
    </div>
    
    <div class="container">
        <div class="card">
            <h2>添加客户</h2>
            <form id="add-customer-form">
                <div class="form-group">
                    <label>客户名称</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>联系方式</label>
                    <input type="text" name="contact">
                </div>
                <div class="form-group">
                    <label>地址</label>
                    <input type="text" name="address">
                </div>
                <button type="submit" class="btn btn-primary">添加</button>
            </form>
        </div>
        
        <div class="card">
            <h2>客户列表</h2>
            {% if customers %}
            <table>
                <thead>
                    <tr>
                        <th>客户名称</th>
                        <th>联系方式</th>
                        <th>欠款金额</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody>
                    {% for c in customers %}
                    <tr>
                        <td>{{ c.name }}</td>
                        <td>{{ c.contact or '' }}</td>
                        <td class="{% if c.debt > 0 %}debt-positive{% else %}debt-zero{% endif %}">
                            ¥{{ '%.2f'|format(c.debt) }}
                        </td>
                        <td>
                            <a href="/reconciliation?customer_id={{ c.id }}" class="btn btn-small">对账</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
            {% else %}
            <p class="no-data">暂无客户，请添加</p>
            {% endif %}
        </div>
    </div>
    
    <script>
        // 添加客户（Ajax）
        document.getElementById('add-customer-form').onsubmit = function(e) {
            e.preventDefault();
            var formData = new FormData(this);
            var data = {};
            formData.forEach(function(value, key) {
                data[key] = value;
            });
            
            fetch('/api/add_customer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert('添加成功！');
                    location.reload();
                }
            });
        };
    </script>
</body>
</html>
